name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  buildOmicron:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Build Omicron Player
      run: |
        mvn -f ./omicron-player/pom.xml --batch-mode clean compile install package
    - name: Deploy Player
      uses: actions/upload-artifact@v4
      with:
        name: 'omicron.jar'
        path: omicron-player/omicron-assembly/target/omicron.jar
    - name: Read version
      run: |
        cd omicron-player
        echo "GITHUB_DDVER=$(mvn -q org.apache.maven.plugins:maven-help-plugin:3.1.1:evaluate -Dexpression=project.version -DforceStdout)" >> $GITHUB_ENV
    - name: Generate Archetype
      run: |
        mvn archetype:generate -DarchetypeGroupId=com.github.msx80.omicron  -DarchetypeArtifactId=omicron-archetype -DarchetypeVersion=$GITHUB_DDVER -DinteractiveMode=false -DgroupId=my.awesome.games -DartifactId=newgame
    - name: Build Generated Archetype
      run: |
        cd newgame
        mvn clean compile package
  buildDemos:
    strategy:
      max-parallel: 1
      matrix:
        demo: [helloworld, featuredemo, snake, alienbuster]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Build Omicron Player
      run: |
        mvn -f ./omicron-player/pom.xml --batch-mode clean compile install package
    - name: Build ${{ matrix.demo }} cart
      run: |
        cd demo/${{ matrix.demo }}
        mvn --batch-mode clean compile install package
    - name: Deploy ${{ matrix.demo }} cartridge
      uses: actions/upload-artifact@v4
      with:
        name: '${{ matrix.demo }}.omicron'
        path: demo/${{ matrix.demo }}/${{ matrix.demo }}.omicron
    - name: Build Web cart for ${{ matrix.demo }}
      run: |
        cd wrappers/web-wrapper
        mvn clean install package -Dcartridge.artifactId=${{ matrix.demo }} -Dcartridge.groupId=com.github.msx80.omicron -Dcartridge.version=0.0.3
    - name: Deploy Web cart for ${{ matrix.demo }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./wrappers/web-wrapper/target/web/dist/webapp
        destination_dir: ${{ matrix.demo }}
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Install packages        
      run: |
        sdkmanager "build-tools;33.0.2" "platforms;android-26"        
    - name: Build ${{ matrix.demo }} Android app
      run: |
        cd wrappers/android-wrapper
        ./gradlew -Pcartridge.artifactId=${{ matrix.demo }} -Pcartridge.groupId=com.github.msx80.omicron  -Pcartridge.version=0.0.3 clean assembleRelease
    - uses: ilharp/sign-android-release@v1
      name: Sign app APK
      id: sign_app
      with:
        releaseDir: wrappers/android-wrapper/android/build/outputs/apk/release/
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.SIGNING_ALIAS }}
        keyStorePassword: ${{ secrets.SIGNING_PASSWORD }}
        buildToolsVersion: 33.0.2
    - name: Rename apk
      run: |
        mv -v ${{steps.sign_app.outputs.signedFile}} ${{ matrix.demo }}.apk
    - name: Deploy ${{ matrix.demo }} Android App
      uses: actions/upload-artifact@v4
      with:
        name: '${{ matrix.demo }}.apk'
        path: '${{ matrix.demo }}.apk'

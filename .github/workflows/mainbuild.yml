name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  buildOmicron:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Build Omicron Player
      run: |
        mvn -f ./omicron-player/pom.xml --batch-mode clean compile install package
    - name: Deploy Player
      uses: actions/upload-artifact@v4
      with:
        name: 'omicron.jar'
        path: omicron-player/omicron-assembly/target/omicron.jar
  buildDemos:
    strategy:
      matrix:
        demo: [helloworld, featuredemo, snake, alienbuster]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Build Omicron Player
      run: |
        mvn -f ./omicron-player/pom.xml --batch-mode clean compile install package
    - name: Build ${{ matrix.demo }} cart
      run: |
        cd demo/${{ matrix.demo }}
        mvn --batch-mode clean compile install package
    - name: Deploy ${{ matrix.demo }} cartridge
      uses: actions/upload-artifact@v4
      with:
        name: '${{ matrix.demo }}.omicron'
        path: demo/${{ matrix.demo }}/${{ matrix.demo }}.omicron
    - name: Build Web cart for ${{ matrix.demo }}
      run: |
        cd wrappers/web-wrapper
        mvn clean install package -Dcartridge.artifactId=${{ matrix.demo }} -Dcartridge.groupId=com.github.msx80.omicron -Dcartridge.version=0.0.3
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Install packages        
      run: |
        sdkmanager "build-tools;33.0.2" "platforms;android-26"        
    - name: Build ${{ matrix.demo }} Android app
      run: |
        cd wrappers/android-wrapper
        ./gradlew -Pcartridge.artifactId=${{ matrix.demo }} -Pcartridge.groupId=com.github.msx80.omicron  -Pcartridge.version=0.0.3 clean assembleRelease
    - name: Deploy ${{ matrix.demo }} Android App
      uses: actions/upload-artifact@v4
      with:
        name: '${{ matrix.demo }}.apk'
        path: wrappers/android-wrapper/android/build/outputs/apk/release/android-release-unsigned.apk

buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.3"

  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
  
}


  if (!project.hasProperty('cartridge.artifactId')) throw new GradleException('Missing required property: cartridge.artifactId')
  if (!project.hasProperty('cartridge.groupId')) throw new GradleException('Missing required property: cartridge.groupId')
  if (!project.hasProperty('cartridge.version')) throw new GradleException('Missing required property: cartridge.version')


  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
  
  
  /*
  The following block is to extract omicron.properties and omicronIcon.png from the cartridge jar
  */
  
configurations {
        cartridgeJar
    }
dependencies {
        cartridgeJar project.properties["cartridge.groupId"]+":"+project.properties["cartridge.artifactId"]+":"+project.properties["cartridge.version"]
    }



    def extractedPropsDir = layout.buildDirectory.dir("extracted-stuff")
    def targetFolder = extractedPropsDir.get().asFile
    targetFolder.mkdirs()
    def files = configurations.cartridgeJar.resolve()
    System.out.println("FILES: "+files)
    def destFileProp = new File(targetFolder, 'omicron.properties')
    def destFileIcon = new File(targetFolder, 'omicronIcon.png')
    files.each { file ->
                zipTree(file).matching {
                    include '**/omicronIcon.png' 
                }.each { propFile ->
                    System.out.println("Found icon file: "+propFile);
                    java.nio.file.Files.copy(propFile.toPath(), destFileIcon.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING);
                }
            }
            
    files.each { file ->
                zipTree(file).matching {
                    include '**/omicron.properties' 
                }.each { propFile ->
                    System.out.println("Found property file: "+propFile);
                    java.nio.file.Files.copy(propFile.toPath(), destFileProp.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING);
                }
            }
    
    ext.omicronProperties = new Properties()

    if (destFileProp.exists()) {
        System.out.println("Properties file found ***** "+destFileProp)
        Properties p = new Properties()
        p.load(destFileProp.newDataInputStream())
        rootProject.ext.omicronProperties = p
    }

    if (destFileIcon.exists()) {
        System.out.println("Icon file found ***** "+destFileIcon)
        // not very nice to change stuff outside the build folder, but ok
        java.nio.file.Files.copy(destFileIcon.toPath(), new File("android/res/drawable/omicronicon.png").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING);
    }
    else
    {
      System.out.println("No icon found, restoring default")
      java.nio.file.Files.copy(new File("default.png").toPath(), new File("android/res/drawable/omicronicon.png").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING);
    }



configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 8
  java.targetCompatibility = 8

  compileJava {
    options.incremental = true
  }
}

subprojects {

  version = project.properties["cartridge.version"].tokenize('.')[-1].toInteger()
  ext.appName = rootProject.ext.omicronProperties.getProperty('omicron.name')
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = project.properties["cartridge.artifactId"] + '-parent'

